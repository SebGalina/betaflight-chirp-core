[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betaflight-chirp-core"
version = "0.4.0"
description = "Betaflight closed-loop chirp / blackbox analysis core — decoder, FRF/Bode, step response, spectral, HTML report."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Sebastien Galina", email = "galina.sebastien@gmail.com" }]
keywords = ["betaflight", "drone", "fpv", "blackbox", "chirp", "frf", "bode", "pid", "tuning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib"]  # only needed for spectral/step plot_results (matplotlib figures)

[project.urls]
Homepage = "https://github.com/SebGalina/betaflight-chirp-core"
Repository = "https://github.com/SebGalina/betaflight-chirp-core"
Issues = "https://github.com/SebGalina/betaflight-chirp-core/issues"
Changelog = "https://github.com/SebGalina/betaflight-chirp-core/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["betaflight_chirp_core*"]

# ship the shared report renderer assets (inlined by report.py, vendored by the front)
[tool.setuptools.package-data]
betaflight_chirp_core = ["report_assets/*.js", "report_assets/*.css", "report_assets/*.json"]
